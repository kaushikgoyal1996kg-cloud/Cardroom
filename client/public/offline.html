<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0a0908" />
    <title>The Card Room — Offline</title>
    <style>
      html, body {
        height: 100%;
        margin: 0;
        background: radial-gradient(ellipse 90% 55% at 50% -5%, #1e1410, #0a0908 70%);
        color: #f6f1e4;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      }
      .wrap {
        min-height: 100dvh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        text-align: center;
        padding:
          calc(env(safe-area-inset-top, 0px) + 24px)
          calc(env(safe-area-inset-right, 0px) + 24px)
          calc(env(safe-area-inset-bottom, 0px) + 24px)
          calc(env(safe-area-inset-left, 0px) + 24px);
      }
      .motif { opacity: 0.85; }
      h1 {
        margin: 0;
        font-size: 1.5rem;
        font-weight: 500;
        letter-spacing: 0.02em;
      }
      p {
        margin: 0;
        max-width: 26rem;
        color: rgba(246, 241, 228, 0.65);
        font-size: 0.95rem;
        line-height: 1.5;
      }
      button {
        margin-top: 10px;
        min-height: 44px;
        padding: 0 22px;
        border-radius: 999px;
        border: 1px solid #8c6d34;
        background: linear-gradient(180deg, #c8a45c, #a8843f);
        color: #0a0908;
        font-weight: 600;
        font-size: 0.95rem;
        touch-action: manipulation;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <svg class="motif" width="72" height="72" viewBox="0 0 100 100" fill="none" aria-hidden="true">
        <ellipse cx="50" cy="50" rx="46" ry="30" stroke="#a8843f" stroke-width="1.2" opacity="0.8" />
        <ellipse cx="50" cy="50" rx="34" ry="20" stroke="#a8843f" stroke-width="1" opacity="0.6" />
        <ellipse cx="50" cy="50" rx="20" ry="11" stroke="#dcc086" stroke-width="1" opacity="0.9" />
        <circle cx="50" cy="50" r="7" fill="#dcc086" opacity="0.85" />
        <circle cx="50" cy="50" r="3" fill="#12100e" />
        <path d="M50 4 V20 M50 80 V96 M4 50 H20 M80 50 H96" stroke="#a8843f" stroke-width="1" opacity="0.5" />
      </svg>
      <h1>The table is offline</h1>
      <p>
        The Card Room needs a connection to deal you in. Check your signal and
        try again; when the server is reachable, the app will attempt to restore your seat.
      </p>
      <button onclick="location.reload()">Try again</button>
    </div>
  </body>
</html>
