<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0a0908" />
    <title>The Card Room — Offline</title>
    <style>
      html, body {
        height: 100%;
        margin: 0;
        background: radial-gradient(ellipse 90% 55% at 50% -5%, #1e1410, #0a0908 70%);
        color: #f6f1e4;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      }
      .wrap {
        min-height: 100dvh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        text-align: center;
        padding:
          calc(env(safe-area-inset-top, 0px) + 24px)
          calc(env(safe-area-inset-right, 0px) + 24px)
          calc(env(safe-area-inset-bottom, 0px) + 24px)
          calc(env(safe-area-inset-left, 0px) + 24px);
      }
      .motif {
        width: 72px;
        height: 72px;
        object-fit: cover;
        border-radius: 22%;
        border: 1px solid rgba(220,192,134,.35);
        box-shadow: 0 12px 28px rgba(0,0,0,.4);
      }
      h1 {
        margin: 0;
        font-size: 1.5rem;
        font-weight: 500;
        letter-spacing: 0.02em;
      }
      p {
        margin: 0;
        max-width: 26rem;
        color: rgba(246, 241, 228, 0.65);
        font-size: 0.95rem;
        line-height: 1.5;
      }
      button {
        margin-top: 10px;
        min-height: 44px;
        padding: 0 22px;
        border-radius: 999px;
        border: 1px solid #8c6d34;
        background: linear-gradient(180deg, #c8a45c, #a8843f);
        color: #0a0908;
        font-weight: 600;
        font-size: 0.95rem;
        touch-action: manipulation;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <img class="motif" src="/brand/card-room-emblem.png" alt="" aria-hidden="true" />
      <h1>The table is offline</h1>
      <p>
        The Card Room needs a connection to deal you in. Check your signal and
        try again; when the server is reachable, the app will attempt to restore your seat.
      </p>
      <button onclick="location.reload()">Try again</button>
    </div>
  </body>
</html>
