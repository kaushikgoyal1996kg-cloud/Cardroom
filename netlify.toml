# ============================================================================
# Netlify configuration - The Card Room (frontend only)
#
# The backend does NOT run here. Netlify serves the compiled React app; the
# Socket.IO server needs a persistent host (see DEPLOYMENT.md).
# ============================================================================

[build]
  base    = "client"
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# Single-page app: every route falls through to index.html so an invite link
# like /join/HZR482 opens the app instead of returning a 404.
[[redirects]]
  from = "/*"
  to   = "/index.html"
  status = 200

[[headers]]
  for = "/assets/*"
  [headers.values]
    # Vite fingerprints asset filenames, so they can be cached indefinitely.
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/index.html"
  [headers.values]
    # Never cache the entry point, or players get a stale app after a deploy.
    Cache-Control = "no-cache"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
