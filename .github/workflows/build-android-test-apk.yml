name: Build Android Test APK

on:
  workflow_dispatch:
  push:
    branches:
      - four-game-release-audit-2026-08-18

permissions:
  contents: read

jobs:
  build:
    name: Verify and build four-game APK
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Install and verify server
        working-directory: server
        run: |
          npm ci
          npm test
          npm run build

      - name: Install and verify client
        working-directory: client
        env:
          VITE_SERVER_URL: https://cardroom-staging-server.onrender.com
          VITE_PUBLIC_APP_URL: https://cardroom-staging.netlify.app
        run: |
          npm ci
          npm test
          npm run build

      - name: Post-unlock whole-game safety audit
        env:
          VITE_SERVER_URL: https://cardroom-staging-server.onrender.com
          VITE_PUBLIC_APP_URL: https://cardroom-staging.netlify.app
        run: |
          set -euo pipefail
          for pass in 1 2 3; do
            echo "=== SERVER WHOLE-GAME SAFETY PASS $pass/3 ==="
            (cd server && npm test)

            echo "=== CLIENT WHOLE-GAME SAFETY PASS $pass/3 ==="
            (cd client && npm test)
          done

      - name: Strict all-tests accounting
        run: |
          set -euo pipefail

          echo "=== SERVER STRICT TEST ACCOUNTING ==="
          (cd server && npx vitest run --reporter=json --outputFile=vitest-strict.json)

          echo "=== CLIENT STRICT TEST ACCOUNTING ==="
          (cd client && npx vitest run --reporter=json --outputFile=vitest-strict.json)

          node <<'CHECK'
          const fs = require('fs');

          let failed = false;

          for (const [name, path] of [
            ['SERVER', 'server/vitest-strict.json'],
            ['CLIENT', 'client/vitest-strict.json'],
          ]) {
            const r = JSON.parse(fs.readFileSync(path, 'utf8'));

            const total = Number(r.numTotalTests ?? 0);
            const passed = Number(r.numPassedTests ?? 0);
            const failedTests = Number(r.numFailedTests ?? 0);
            const pending = Number(r.numPendingTests ?? 0);
            const todo = Number(r.numTodoTests ?? 0);

            console.log(
              `${name}: total=${total} passed=${passed} failed=${failedTests} skipped/pending=${pending} todo=${todo}`
            );

            if (
              r.success !== true ||
              passed !== total ||
              failedTests !== 0 ||
              pending !== 0 ||
              todo !== 0
            ) {
              failed = true;
            }
          }

          if (failed) {
            console.error('STRICT TEST ACCOUNTING FAILED');
            process.exit(1);
          }

          console.log('STRICT TEST ACCOUNTING PASSED — every discovered test passed');
          CHECK

      - name: Generate Android project
        working-directory: client
        env:
          VITE_SERVER_URL: https://cardroom-staging-server.onrender.com
          VITE_PUBLIC_APP_URL: https://cardroom-staging.netlify.app
        run: npm run android:init

      - name: Build debug APK
        working-directory: client
        env:
          VITE_SERVER_URL: https://cardroom-staging-server.onrender.com
          VITE_PUBLIC_APP_URL: https://cardroom-staging.netlify.app
        run: npm run android:debug

      - name: Create checksum
        run: sha256sum client/android/app/build/outputs/apk/debug/app-debug.apk > cardroom-four-games-debug.apk.sha256

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: cardroom-four-games-debug-apk
          path: |
            client/android/app/build/outputs/apk/debug/app-debug.apk
            cardroom-four-games-debug.apk.sha256
          if-no-files-found: error
          retention-days: 14
