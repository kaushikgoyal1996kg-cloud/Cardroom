name: Build Android Test APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Verify and build Hazari + Kitti APK
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Install and verify server
        working-directory: server
        run: |
          npm ci
          npm test
          npm run build

      - name: Install and verify client
        working-directory: client
        env:
          VITE_SERVER_URL: https://cardroom-staging-server.onrender.com
          VITE_PUBLIC_APP_URL: https://cardroom-staging.netlify.app
        run: |
          npm ci
          npm test
          npm run build

      - name: Generate Android project
        working-directory: client
        env:
          VITE_SERVER_URL: https://cardroom-staging-server.onrender.com
          VITE_PUBLIC_APP_URL: https://cardroom-staging.netlify.app
        run: npm run android:init

      - name: Build debug APK
        working-directory: client
        env:
          VITE_SERVER_URL: https://cardroom-staging-server.onrender.com
          VITE_PUBLIC_APP_URL: https://cardroom-staging.netlify.app
        run: npm run android:debug

      - name: Create checksum
        run: sha256sum client/android/app/build/outputs/apk/debug/app-debug.apk > cardroom-hazari-kitti-debug.apk.sha256

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: cardroom-hazari-kitti-debug-apk
          path: |
            client/android/app/build/outputs/apk/debug/app-debug.apk
            cardroom-hazari-kitti-debug.apk.sha256
          if-no-files-found: error
          retention-days: 14
